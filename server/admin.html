<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BorderWar server</title>
<style>
  :root { color-scheme: dark; --bg:#12151a; --panel:#1b2028; --line:#2b323d; --text:#e4e8ee; --dim:#8b95a5; --ok:#5fce8a; --warn:#e8b34b; --bad:#ec6a5e; --s1:#3987e5; --s2:#d95926; --s3:#3bb58f; --grid:#262c36; --axis:#3a4350; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, Segoe UI, sans-serif; }
  h1 { font-size:18px; margin:0; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  #status { color:var(--dim); font-size:12px; margin-left:auto; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit; }
  select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 6px; font:inherit; max-width:200px; }
  button:hover { border-color:var(--dim); }
  input { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 10px; font:inherit; width:min(360px,100%); }
  #login { max-width:420px; margin:12vh auto; display:grid; gap:10px; }
  #login p { color:var(--dim); margin:0; }
  #error { color:var(--bad); min-height:1.4em; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:18px; }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .tile b { display:block; font-size:22px; font-variant-numeric:tabular-nums; }
  .tile span { color:var(--dim); font-size:12px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:18px 0 8px; }
  .game { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:10px; }
  .game .top { display:flex; gap:10px; flex-wrap:wrap; align-items:baseline; }
  .game .id { font-weight:600; font-family:ui-monospace, Consolas, monospace; }
  .game .meta { color:var(--dim); font-size:12px; }
  .tag { font-size:11px; border-radius:4px; padding:1px 6px; border:1px solid var(--line); color:var(--dim); }
  .tag.ACTIVE { color:var(--ok); border-color:var(--ok); }
  .tag.LOBBY { color:var(--warn); border-color:var(--warn); }
  .tag.bad { color:var(--bad); border-color:var(--bad); }
  .players { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .player { background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:2px 9px; font-size:12px; }
  .player.off { opacity:.45; text-decoration:line-through; }
  .player.spec { font-style:italic; }
  .empty { color:var(--dim); }
  .ranges { display:flex; gap:6px; margin-bottom:10px; }
  .ranges button[aria-pressed="true"] { border-color:var(--s1); background:#1f2a3a; }
  .charts { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:10px; }
  .chart { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px 6px; min-width:0; }
  .chart h3 { font-size:14px; margin:0; font-weight:600; }
  .chart .sub { color:var(--dim); font-size:12px; }
  .legend { display:flex; gap:14px; font-size:12px; color:var(--dim); margin-top:4px; }
  .key { display:inline-block; width:12px; height:2px; border-radius:1px; vertical-align:middle; margin-right:6px; }
  .plotwrap { position:relative; margin-top:6px; }
  .plot svg { display:block; outline:none; }
  .plot svg:focus-visible { outline:1px solid var(--axis); border-radius:4px; }
  .plot text { fill:var(--dim); font-size:11px; font-variant-numeric:tabular-nums; }
  .tip { position:absolute; top:6px; pointer-events:none; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 9px; font-size:12px; white-space:nowrap; z-index:1; }
  .tip .when { color:var(--dim); margin-bottom:2px; }
  .tip b { font-variant-numeric:tabular-nums; margin-right:6px; }
  .tip .name { color:var(--dim); }
  details { margin-top:10px; }
  summary { color:var(--dim); font-size:12px; cursor:pointer; }
  .tablebox { max-height:260px; overflow:auto; margin-top:8px; border:1px solid var(--line); border-radius:8px; }
  table { border-collapse:collapse; width:100%; font-size:12px; font-variant-numeric:tabular-nums; }
  th, td { text-align:right; padding:4px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { position:sticky; top:0; background:var(--panel); color:var(--dim); font-weight:500; }
  textarea { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 10px; font:inherit; width:100%; min-height:120px; resize:vertical; }
  #news { display:grid; gap:8px; max-width:560px; }
  #news input { width:100%; }
  #news .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #newsStatus { color:var(--dim); font-size:12px; }
  #newsTools { display:flex; gap:6px; flex-wrap:wrap; }
  #newsTools button { padding:3px 9px; font-size:13px; }
  #newsPreview { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; overflow-wrap:anywhere; }
  #newsPreview > * { margin:0 0 10px; }
  #newsPreview > :last-child { margin-bottom:0; }
  #newsPreview h3 { font-size:16px; }
  #newsPreview h4 { font-size:14px; }
  #newsPreview ul { padding-left:20px; }
  #newsPreview a { color:#a9cdff; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<form id="login" hidden>
  <h1>BorderWar server</h1>
  <p>Paste the admin token (server/data/admin-token.txt on the host).</p>
  <input id="token" type="password" autocomplete="off" placeholder="Admin token">
  <button type="submit">View stats</button>
  <div id="error"></div>
</form>

<main id="dash" hidden>
  <header>
    <h1>BorderWar server</h1>
    <span id="build" class="tag"></span>
    <span id="status"></span>
    <select id="tz" aria-label="Time zone"></select>
    <button id="pause" type="button">Pause</button>
    <button id="logout" type="button">Forget token</button>
  </header>
  <div class="tiles" id="tiles"></div>
  <section id="history" hidden>
    <h2>History</h2>
    <div class="ranges" id="ranges" role="group" aria-label="Time range"></div>
    <div class="charts" id="charts"></div>
    <details id="tabledetails">
      <summary>Data table</summary>
      <div class="tablebox"><table id="table"></table></div>
    </details>
  </section>
  <h2>Active games</h2>
  <div id="active"></div>
  <h2>Lobbies</h2>
  <div id="lobbies"></div>
  <h2>What's new post</h2>
  <form id="news">
    <input id="newsTitle" type="text" maxlength="80" autocomplete="off" placeholder="Title">
    <div id="newsTools" role="toolbar" aria-label="Formatting">
      <button type="button" data-wrap="**" data-hint="bold text" title="Bold (Ctrl+B)"><b>B</b></button>
      <button type="button" data-wrap="*" data-hint="italic text" title="Italic (Ctrl+I)"><i>I</i></button>
      <button type="button" data-line="# " title="Heading">Heading</button>
      <button type="button" data-line="## " title="Smaller heading">Subheading</button>
      <button type="button" data-line="- " title="Bullet list">List</button>
      <button type="button" data-link title="Link (Ctrl+K)">Link</button>
    </div>
    <textarea id="newsBody" maxlength="1500" placeholder="Shown from the game's main menu."></textarea>
    <div id="newsPreview" hidden></div>
    <div class="row">
      <button type="submit">Publish</button>
      <button id="newsRemove" type="button">Remove post</button>
      <span id="newsStatus"></span>
    </div>
  </form>
</main>

<script src="/js/markup.js"></script>
<script>
(function () {
  'use strict';
  var REFRESH_MS = 3000;
  var KEY = 'borderwar-admin-token';
  var $ = function (id) { return document.getElementById(id); };
  var token = null, timer = null, paused = false, lastUpdate = 0;
  try { token = localStorage.getItem(KEY); } catch (e) {}

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function dur(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    if (d) return d + 'd ' + h + 'h';
    if (h) return h + 'h ' + m + 'm';
    if (m) return m + 'm ' + (s % 60) + 's';
    return s + 's';
  }
  function mb(bytes) { return Math.round(bytes / 1048576) + ' MB'; }

  function showLogin(msg) {
    clearTimeout(timer);
    $('dash').hidden = true;
    $('login').hidden = false;
    $('error').textContent = msg || '';
    $('token').focus();
  }

  function tile(value, label) {
    var t = el('div', 'tile');
    t.appendChild(el('b', null, value));
    t.appendChild(el('span', null, label));
    return t;
  }

  function gameCard(g, now) {
    var card = el('div', 'game');
    var top = el('div', 'top');
    top.appendChild(el('span', 'id', g.gameID));
    top.appendChild(el('span', 'tag ' + g.stage, g.stage));
    if (g.isAuto) top.appendChild(el('span', 'tag', 'open rotation'));
    else top.appendChild(el('span', 'tag', g.isPublic ? 'public' : 'private'));
    if (g.desynced) top.appendChild(el('span', 'tag bad', g.desynced + ' desynced'));

    var meta = [];
    if (g.map) meta.push(g.map + ' map');
    if (g.mode) meta.push(g.mode);
    if (g.bots != null) meta.push(g.bots + ' bots');
    if (g.tribes != null) meta.push(g.tribes + ' tribes');
    if (g.stage === 'ACTIVE') {
      meta.push('running ' + dur(now - g.startedAt));
      meta.push('turn ' + g.turn);
    } else if (g.autoStartAt) {
      meta.push('starts in ' + dur(g.autoStartAt - now));
    }
    top.appendChild(el('span', 'meta', meta.join(' · ')));
    card.appendChild(top);

    var players = el('div', 'players');
    if (!g.clients.length) players.appendChild(el('span', 'empty', 'No one here'));
    g.clients.forEach(function (c) {
      var p = el('span', 'player' + (c.connected ? '' : ' off') + (c.spectator ? ' spec' : ''),
        (c.username || '(unnamed)') + (c.spectator ? ' (spectating)' : ''));
      p.title = 'client ' + c.clientID + (c.connected ? ', last heard ' + dur(c.idleMs) + ' ago' : ', disconnected');
      players.appendChild(p);
    });
    card.appendChild(players);
    return card;
  }

  function fill(node, games, now, emptyText) {
    node.textContent = '';
    if (!games.length) return node.appendChild(el('div', 'empty', emptyText));
    games.forEach(function (g) { node.appendChild(gameCard(g, now)); });
  }

  function render(s) {
    $('login').hidden = true;
    $('dash').hidden = false;
    $('build').textContent = 'build ' + (s.server.build || '?');
    var t = $('tiles');
    t.textContent = '';
    t.appendChild(tile(s.totals.players, 'in multiplayer'));
    t.appendChild(tile(s.totals.solo || 0, 'in single player'));
    t.appendChild(tile(s.totals.spectators, 'spectators'));
    t.appendChild(tile(s.totals.activeGames, 'active games'));
    t.appendChild(tile(s.totals.lobbies, 'open lobbies'));
    t.appendChild(tile(s.totals.sockets, 'open sockets'));
    t.appendChild(tile(s.totals.peakConnections, 'peak sockets'));
    t.appendChild(tile(s.totals.totalConnections, 'connections since start'));
    t.appendChild(tile(dur(s.server.uptimeMs), 'uptime'));
    t.appendChild(tile(mb(s.server.rss), 'server memory'));
    t.appendChild(tile(mb(s.server.systemFreeMem), 'host free memory'));
    fill($('active'), s.games.filter(function (g) { return g.stage === 'ACTIVE'; }), s.now, 'No games running.');
    fill($('lobbies'), s.games.filter(function (g) { return g.stage === 'LOBBY'; }), s.now, 'No lobbies.');
  }

  // ---- History charts. One sample a minute from /admin/history; a sample row
  // is [t, players, spectators, activeGames, lobbies, sockets, rssMB, solo].
  var SVGNS = 'http://www.w3.org/2000/svg';
  var HISTORY_MS = 60000;
  var RANGE_KEY = 'borderwar-admin-range';
  var TZ_KEY = 'borderwar-admin-tz';
  var RANGES = [
    { label: '1 hour', ms: 3600e3, bucket: 60e3, sub: 'Per minute' },
    { label: '24 hours', ms: 86400e3, bucket: 600e3, sub: 'Peak per 10 minutes' },
    { label: '7 days', ms: 604800e3, bucket: 3600e3, sub: 'Peak per hour' }
  ];
  var CHARTS = [
    { title: 'Players online', unit: '', series: [
      { key: 1, name: 'Multiplayer', color: 'var(--s1)' },
      { key: 7, name: 'Single player', color: 'var(--s3)' },
      { key: 2, name: 'Spectators', color: 'var(--s2)' }] },
    { title: 'Active games', unit: '', series: [{ key: 3, name: 'Active games', color: 'var(--s1)' }] },
    { title: 'Server memory', unit: ' MB', series: [{ key: 6, name: 'Memory', color: 'var(--s1)' }] }
  ];
  var TABLE_COLS = [[1, 'Multiplayer'], [7, 'Single player'], [2, 'Spectators'], [3, 'Active games'], [4, 'Lobbies'], [5, 'Sockets'], [6, 'Memory (MB)']];
  var hist = [], lastT = 0, histTimer = null, rangeIdx = 0, view = null;
  try { rangeIdx = Math.min(RANGES.length - 1, Math.max(0, Number(localStorage.getItem(RANGE_KEY)) || 0)); } catch (e) {}

  function svgEl(tag, attrs, parent) {
    var n = document.createElementNS(SVGNS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  // Time zone: '' is the browser's own, otherwise an IANA name or 'UTC'.
  var tz = '', fmtHm = null, fmtDay = null, fmtFull = null;
  try { tz = localStorage.getItem(TZ_KEY) || ''; } catch (e) {}
  function setZone(z) {
    try {
      var o = z ? { timeZone: z } : {};
      fmtHm = new Intl.DateTimeFormat([], Object.assign({ hour: '2-digit', minute: '2-digit', hour12: false }, o));
      fmtDay = new Intl.DateTimeFormat([], Object.assign({ weekday: 'short' }, o));
      fmtFull = new Intl.DateTimeFormat([], Object.assign({ timeStyle: 'medium' }, o));
      tz = z;
    } catch (e) { if (z) setZone(''); }
  }
  setZone(tz);
  function clock(t) {
    var hm = fmtHm.format(t);
    return view.r.ms > 86400e3 ? fmtDay.format(t) + ' ' + hm : hm;
  }
  function buildZones() {
    var sel = $('tz'), zones = [];
    try { zones = Intl.supportedValuesOf('timeZone'); } catch (e) {}
    if (zones.indexOf('UTC') < 0) zones.unshift('UTC');
    var local = '';
    try { local = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) {}
    var opt = el('option', null, 'Browser time' + (local ? ' (' + local + ')' : ''));
    opt.value = '';
    sel.appendChild(opt);
    zones.forEach(function (z) { var o = el('option', null, z); o.value = z; sel.appendChild(o); });
    sel.value = tz;
    if (sel.value !== tz) { setZone(''); sel.value = ''; }
    sel.addEventListener('change', function () {
      setZone(sel.value);
      try { localStorage.setItem(TZ_KEY, tz); } catch (e) {}
      if (view) renderCharts();
      if (lastUpdate) $('status').textContent = 'Updated ' + fmtFull.format(lastUpdate);
    });
  }
  // A 1/2/5 step that puts about four gridlines under max.
  function niceStep(max) {
    if (max <= 0) return 1;
    var raw = max / 4, p = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10)), f = raw / p;
    return Math.max(1, (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p);
  }

  function buildCharts() {
    RANGES.forEach(function (r, i) {
      var b = el('button', null, r.label);
      b.type = 'button';
      b.addEventListener('click', function () {
        rangeIdx = i;
        try { localStorage.setItem(RANGE_KEY, String(i)); } catch (e) {}
        renderCharts();
      });
      r.button = b;
      $('ranges').appendChild(b);
    });
    CHARTS.forEach(function (c) {
      var card = el('section', 'chart');
      card.appendChild(el('h3', null, c.title));
      c.sub = card.appendChild(el('div', 'sub'));
      if (c.series.length > 1) {
        var legend = card.appendChild(el('div', 'legend'));
        c.series.forEach(function (s) {
          var item = legend.appendChild(el('span'));
          item.appendChild(el('span', 'key')).style.background = s.color;
          item.appendChild(document.createTextNode(s.name));
        });
      }
      var wrap = card.appendChild(el('div', 'plotwrap'));
      c.plot = wrap.appendChild(el('div', 'plot'));
      c.tip = wrap.appendChild(el('div', 'tip'));
      c.tip.hidden = true;
      $('charts').appendChild(card);
    });
    $('tabledetails').addEventListener('toggle', renderTable);
    var resizeTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () { if (view) renderCharts(); }, 150);
    });
  }

  // Buckets the samples for the chosen range, keeping each field's peak.
  function renderCharts() {
    var r = RANGES[rangeIdx];
    var end = Math.ceil(Date.now() / r.bucket) * r.bucket, start = end - r.ms, n = r.ms / r.bucket;
    var b = [], i;
    for (i = 0; i < n; i++) b.push(null);
    hist.forEach(function (s) {
      var i = Math.floor((s[0] - start) / r.bucket);
      if (i < 0 || i >= n) return;
      if (!b[i]) { b[i] = s.slice(); b[i][0] = start + i * r.bucket; return; }
      for (var k = 1; k < s.length; k++) if (s[k] > b[i][k]) b[i][k] = s[k];
    });
    view = { r: r, start: start, n: n, b: b };
    RANGES.forEach(function (x, i) { x.button.setAttribute('aria-pressed', i === rangeIdx ? 'true' : 'false'); });
    // Empty every plot before measuring, or an old wider SVG holds its card open.
    CHARTS.forEach(function (c) { c.plot.textContent = ''; });
    CHARTS.forEach(drawChart);
    renderTable();
  }

  function drawChart(c) {
    var b = view.b, n = view.n;
    var W = c.plot.clientWidth || 320, H = 170, L = 38, R = 12, T = 10, B = 22;
    var pw = W - L - R, ph = H - T - B;
    var max = 0;
    b.forEach(function (row) {
      if (row) c.series.forEach(function (s) { if (row[s.key] > max) max = row[s.key]; });
    });
    var step = niceStep(max), top = Math.max(step, Math.ceil(max / step) * step);
    function x(i) { return L + (i + 0.5) / n * pw; }
    function y(v) { return T + ph - v / top * ph; }
    c.sub.textContent = view.r.sub + ' · peak ' + max + c.unit;
    c.tip.hidden = true;
    c.plot.textContent = '';
    var svg = svgEl('svg', { width: W, height: H, tabindex: 0, role: 'img',
      'aria-label': c.title + ', last ' + view.r.label + ', peak ' + max + c.unit }, c.plot);

    for (var v = 0; v <= top + step / 2; v += step) {
      svgEl('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), style: 'stroke:var(' + (v ? '--grid' : '--axis') + ')' }, svg);
      svgEl('text', { x: L - 6, y: y(v), dy: '.32em', 'text-anchor': 'end' }, svg).textContent = v;
    }
    var ticks = W < 420 ? 3 : 5;
    for (var j = 0; j < ticks; j++) {
      var f = j / (ticks - 1);
      svgEl('text', { x: L + f * pw, y: H - 5, 'text-anchor': j === 0 ? 'start' : j === ticks - 1 ? 'end' : 'middle' }, svg)
        .textContent = clock(view.start + f * view.r.ms);
    }

    c.series.forEach(function (s) {
      // A run of buckets with data is one line; a hole (server down) breaks it.
      var runs = [], run = null, last = -1;
      for (var i = 0; i < n; i++) {
        if (!b[i]) { run = null; continue; }
        if (!run) runs.push(run = []);
        run.push(i);
        last = i;
      }
      runs.forEach(function (run) {
        var pts = run.map(function (i) { return x(i).toFixed(1) + ',' + y(b[i][s.key]).toFixed(1); });
        if (pts.length === 1) pts.push(pts[0]);
        if (c.series.length === 1) {
          svgEl('path', { d: 'M' + pts.join('L') + 'L' + x(run[run.length - 1]).toFixed(1) + ',' + y(0) + 'L' + x(run[0]).toFixed(1) + ',' + y(0) + 'Z',
            style: 'fill:' + s.color + ';opacity:.1' }, svg);
        }
        svgEl('path', { d: 'M' + pts.join('L'), fill: 'none', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
          style: 'stroke:' + s.color }, svg);
      });
      if (last >= 0) {
        svgEl('circle', { cx: x(last), cy: y(b[last][s.key]), r: 4, 'stroke-width': 2, style: 'fill:' + s.color + ';stroke:var(--panel)' }, svg);
      }
    });

    // Hover layer: a crosshair that snaps to the nearest bucket, one readout
    // for every series. Arrow keys move it when the chart has focus.
    var hover = svgEl('g', { visibility: 'hidden' }, svg);
    var cross = svgEl('line', { y1: T, y2: T + ph, style: 'stroke:var(--dim)' }, hover);
    var dots = c.series.map(function (s) {
      return svgEl('circle', { r: 4, 'stroke-width': 2, style: 'fill:' + s.color + ';stroke:var(--panel)' }, hover);
    });
    var at = -1;
    function show(i) {
      at = Math.max(0, Math.min(n - 1, i));
      var row = b[at];
      hover.setAttribute('visibility', 'visible');
      cross.setAttribute('x1', x(at));
      cross.setAttribute('x2', x(at));
      c.tip.textContent = '';
      c.tip.appendChild(el('div', 'when', clock(view.start + at * view.r.bucket)));
      c.series.forEach(function (s, k) {
        dots[k].setAttribute('visibility', row ? 'inherit' : 'hidden');
        if (!row) return;
        dots[k].setAttribute('cx', x(at));
        dots[k].setAttribute('cy', y(row[s.key]));
        var line = c.tip.appendChild(el('div'));
        line.appendChild(el('span', 'key')).style.background = s.color;
        line.appendChild(el('b', null, row[s.key] + c.unit));
        line.appendChild(el('span', 'name', s.name));
      });
      if (!row) c.tip.appendChild(el('div', 'name', 'No data (server offline)'));
      c.tip.hidden = false;
      var left = x(at) + 12;
      if (left + c.tip.offsetWidth > W) left = x(at) - 12 - c.tip.offsetWidth;
      c.tip.style.left = Math.max(0, left) + 'px';
    }
    function hide() {
      at = -1;
      hover.setAttribute('visibility', 'hidden');
      c.tip.hidden = true;
    }
    svg.addEventListener('pointermove', function (e) {
      show(Math.floor((e.clientX - svg.getBoundingClientRect().left - L) / pw * n));
    });
    svg.addEventListener('pointerleave', hide);
    svg.addEventListener('blur', hide);
    svg.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      show(at < 0 ? n - 1 : at + (e.key === 'ArrowLeft' ? -1 : 1));
    });
  }

  function renderTable() {
    if (!view || !$('tabledetails').open) return;
    var table = $('table');
    table.textContent = '';
    var head = table.appendChild(el('tr'));
    head.appendChild(el('th', null, 'Time'));
    TABLE_COLS.forEach(function (col) { head.appendChild(el('th', null, col[1])); });
    for (var i = view.n - 1; i >= 0; i--) {
      var row = view.b[i];
      if (!row) continue;
      var tr = table.appendChild(el('tr'));
      tr.appendChild(el('td', null, clock(row[0])));
      TABLE_COLS.forEach(function (col) { tr.appendChild(el('td', null, row[col[0]])); });
    }
  }

  function loadHistory() {
    clearTimeout(histTimer);
    if (!token) return;
    histTimer = setTimeout(loadHistory, HISTORY_MS);
    if (paused) return;
    fetch('/admin/history' + (lastT ? '?since=' + lastT : ''), { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' })
      .then(function (res) { return res.ok ? res.json() : null; })
      .then(function (h) {
        if (!h) return;
        hist = hist.concat(h.samples);
        if (hist.length) lastT = hist[hist.length - 1][0];
        var cutoff = Date.now() - RANGES[RANGES.length - 1].ms;
        while (hist.length && hist[0][0] < cutoff) hist.shift();
        $('history').hidden = false;
        renderCharts();
      })
      .catch(function () {});
  }
  function resetHistory() {
    clearTimeout(histTimer);
    histTimer = null;
    hist = [];
    lastT = 0;
    $('history').hidden = true;
  }

  // ---- What's new post (server/news.js). Loaded once per sign-in, so a
  // refresh never overwrites a draft.
  var newsLoaded = false;
  function newsStatus(post, verb) {
    $('newsStatus').style.color = '';
    $('newsStatus').textContent = post ? verb + ' ' + new Date(post.at).toLocaleString() : 'No post is showing.';
    $('newsRemove').disabled = !post;
  }
  function previewNews() {
    var text = $('newsBody').value;
    $('newsPreview').hidden = !text.trim();
    Markup.render($('newsPreview'), text);
  }
  $('newsBody').addEventListener('input', previewNews);

  // Formatting buttons: each writes js/markup.js markup around the selection.
  // execCommand keeps the edit in the textarea's undo history.
  function newsReplace(start, end, text, selStart, selEnd) {
    var ta = $('newsBody');
    ta.focus();
    ta.setSelectionRange(start, end);
    var done = false;
    try { done = document.execCommand('insertText', false, text); } catch (e) {}
    if (!done) ta.setRangeText(text, start, end, 'end');
    ta.setSelectionRange(start + selStart, start + selEnd);
    previewNews();
  }
  // Wraps the selection in `mark`, or unwraps it if it already is.
  function newsWrap(mark, hint) {
    var ta = $('newsBody'), v = ta.value, s = ta.selectionStart, e = ta.selectionEnd, n = mark.length;
    if (s >= n && v.slice(s - n, s) === mark && v.slice(e, e + n) === mark && v.charAt(s - n - 1) !== '*' && v.charAt(e + n) !== '*') {
      return newsReplace(s - n, e + n, v.slice(s, e), 0, e - s);
    }
    var inner = v.slice(s, e) || hint;
    newsReplace(s, e, mark + inner + mark, n, n + inner.length);
  }
  // Starts every selected line with `prefix`, replacing any other line markup;
  // takes it off again if they all have it.
  function newsLines(prefix) {
    var ta = $('newsBody'), v = ta.value;
    var s = v.lastIndexOf('\n', ta.selectionStart - 1) + 1;
    var e = v.indexOf('\n', ta.selectionEnd);
    if (e < 0) e = v.length;
    var lines = v.slice(s, e).split('\n');
    var filled = lines.filter(function (l) { return l.trim(); });
    var all = filled.length && filled.every(function (l) { return l.indexOf(prefix) === 0; });
    var out = lines.map(function (l) {
      if (!l.trim() && lines.length > 1) return l;
      var bare = l.replace(/^(#{1,2}|[-*])\s+/, '');
      return all ? bare : prefix + bare;
    }).join('\n');
    newsReplace(s, e, out, 0, out.length);
  }
  function newsLink() {
    var ta = $('newsBody'), sel = ta.value.slice(ta.selectionStart, ta.selectionEnd);
    var isUrl = /^https?:\/\/\S+$/.test(sel);
    var text = isUrl || !sel ? 'link text' : sel, url = isUrl ? sel : 'https://';
    var out = '[' + text + '](' + url + ')';
    // Leave selected whichever half still needs typing.
    if (isUrl || !sel) newsReplace(ta.selectionStart, ta.selectionEnd, out, 1, 1 + text.length);
    else newsReplace(ta.selectionStart, ta.selectionEnd, out, text.length + 3, text.length + 3 + url.length);
  }
  $('newsTools').addEventListener('mousedown', function (e) { e.preventDefault(); });
  $('newsTools').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.wrap) newsWrap(b.dataset.wrap, b.dataset.hint);
    else if (b.dataset.line) newsLines(b.dataset.line);
    else newsLink();
  });
  $('newsBody').addEventListener('keydown', function (e) {
    if (!(e.ctrlKey || e.metaKey) || e.altKey || e.shiftKey) return;
    var k = e.key.toLowerCase();
    if (k !== 'b' && k !== 'i' && k !== 'k') return;
    e.preventDefault();
    if (k === 'b') newsWrap('**', 'bold text');
    else if (k === 'i') newsWrap('*', 'italic text');
    else newsLink();
  });
  function loadNews() {
    if (newsLoaded) return;
    newsLoaded = true;
    fetch('/news', { cache: 'no-store' })
      .then(function (res) { return res.ok ? res.json() : Promise.reject(); })
      .then(function (n) {
        if (n.post) { $('newsTitle').value = n.post.title; $('newsBody').value = n.post.body; previewNews(); }
        newsStatus(n.post, 'Published');
      })
      .catch(function () { newsLoaded = false; });
  }
  function saveNews(title, body) {
    fetch('/admin/news', {
      method: 'POST', cache: 'no-store',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: title, body: body })
    })
      .then(function (res) { return res.json().then(function (j) { return { ok: res.ok, j: j }; }); })
      .then(function (r) {
        if (!r.ok) throw new Error(r.j.message || r.j.error || 'Not saved');
        if (!r.j.post) { $('newsTitle').value = ''; $('newsBody').value = ''; previewNews(); }
        newsStatus(r.j.post, 'Published');
      })
      .catch(function (e) {
        $('newsStatus').style.color = 'var(--bad)';
        $('newsStatus').textContent = 'Not saved: ' + (e && e.message || 'server unreachable');
      });
  }
  $('news').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!$('newsTitle').value.trim() && !$('newsBody').value.trim()) {
      $('newsStatus').style.color = 'var(--bad)';
      $('newsStatus').textContent = 'Write a title or some text first.';
      return;
    }
    saveNews($('newsTitle').value, $('newsBody').value);
  });
  $('newsRemove').addEventListener('click', function () {
    if (confirm('Remove the post from the game menu?')) saveNews('', '');
  });

  function schedule() {
    clearTimeout(timer);
    if (!paused) timer = setTimeout(refresh, REFRESH_MS);
  }

  function refresh() {
    fetch('/admin/stats', { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store' })
      .then(function (res) {
        if (res.status === 401) {
          try { localStorage.removeItem(KEY); } catch (e) {}
          token = null;
          resetHistory();
          showLogin('That token was not accepted.');
          return null;
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (s) {
        if (!s) return;
        render(s);
        loadNews();
        if (!histTimer) loadHistory();
        lastUpdate = Date.now();
        $('status').textContent = 'Updated ' + fmtFull.format(lastUpdate);
        $('status').style.color = '';
        schedule();
      })
      .catch(function () {
        if (!token) return;
        $('status').textContent = 'Server unreachable, retrying';
        $('status').style.color = 'var(--bad)';
        schedule();
      });
  }

  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    token = $('token').value.trim();
    $('token').value = '';
    if (!token) return;
    try { localStorage.setItem(KEY, token); } catch (err) {}
    refresh();
  });
  $('logout').addEventListener('click', function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    token = null;
    newsLoaded = false;
    resetHistory();
    showLogin('');
  });
  $('pause').addEventListener('click', function () {
    paused = !paused;
    $('pause').textContent = paused ? 'Resume' : 'Pause';
    if (paused) clearTimeout(timer); else refresh();
  });

  buildZones();
  buildCharts();
  if (token) refresh(); else showLogin('');
})();
</script>
</body>
</html>
