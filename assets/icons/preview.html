<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Icon preview</title>
<style>
  body { background: #060a14; color: #dfe6f0; font: 14px system-ui, sans-serif; margin: 20px; }
  p { color: #8fa0b8; }
  h3 { margin: 24px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
  .cell { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #0d1426; border-radius: 6px; }
  .cell .n { flex: 1; }
  .cell code { color: #8fa0b8; font-size: 12px; }
  .cell img { vertical-align: middle; }
  .chip { display: inline-flex; padding: 4px; border-radius: 4px; }
</style>
</head>
<body>
<h2>Icon preview</h2>
<p>Open via the dev server at /assets/icons/preview.html. Replace any .svg here with your own art (same name, square viewBox) and reload.</p>
<div id="groups"></div>
<script>
  // Grouped by where each icon is used. The emoji is what it replaced.
  const GROUPS = {
    'Map labels & badges': [['ally', '🤝', 'Allied'], ['teammate', '👥', 'Teammate'], ['target', '🎯', 'Marked target'],
      ['traitor', '🗡', 'Traitor'], ['embargo', '🚫', 'Trade blocked'], ['expiring', '⏳', 'Alliance expiring']],
    'Build bar': [['city', '🏙', 'City'], ['factory', '🏭', 'Factory'], ['port', '⚓', 'Port'], ['fort', '🛡', 'Defense Fort'],
      ['warship', '🚢', 'Warship'], ['silo', '🚀', 'Missile Silo'], ['nuke', '☢', 'Atom Bomb'], ['hbomb', '💥', 'Hydrogen Bomb'],
      ['sam', '📡', 'SAM Launcher'], ['mirv', '🛰', 'MIRV']],
    'Players & fronts': [['bot', '🤖', 'Bot'], ['disconnected', '🔌', 'Disconnected'], ['mood-friendly', '🙂', 'Friendly'],
      ['mood-neutral', '😐', 'Distrustful'], ['mood-hostile', '🙁', 'Hostile'], ['attack', '⚔', 'Our attack'],
      ['boat', '⛵', 'Our boat'], ['boat-enemy', '🚤', 'Enemy boat']],
    'Diplomacy wheel & HUD': [['gold', '🪙', 'Gold'], ['troops', '🪖', 'Troops'], ['trade', '💰', 'Trade'],
      ['gift', '🎁', 'Donate'], ['back', '↩', 'Back'], ['play', '▶', 'Resume'], ['pause', '❚❚', 'Pause']]
  };
  const bgs = ['#0b1020', '#1e2a44', '#3a6e8f', '#8c4a3c', '#6f8f3a', '#b39a5a'];
  let html = '';
  for (const [title, icons] of Object.entries(GROUPS)) {
    html += `<h3>${title}</h3><div class="grid">`;
    for (const [name, emoji, label] of icons) {
      html += `<div class="cell"><span style="font-size:20px">${emoji}</span>` +
        [16, 24, 40].map(s => `<img src="${name}.svg" width="${s}" height="${s}">`).join('') +
        `<span class="n">${label}<br><code>${name}.svg</code></span>` +
        `<span>${bgs.slice(2).map(b => `<span class="chip" style="background:${b}"><img src="${name}.svg" width="16" height="16"></span>`).join('')}</span></div>`;
    }
    html += '</div>';
  }
  document.getElementById('groups').innerHTML = html;
</script>
</body>
</html>
